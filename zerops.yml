# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yaml-json-schema.json
#
# Maps the project value store (APP_URL / API_URL, plus recipe aliases
# NEXT_STORE_URL / MEDUSA_INSTANCE_URL) to Medusa keys.
# Setup name `medusa` must match import.yaml zeropsSetup.

zerops:
  - setup: medusa
    build:
      # Admin dashboard needs the public backend URL at build time.
      envVariables:
        BACKEND_URL: ${API_URL}
      base: nodejs@22
      # Yarn 1.22 — lockfile is classic, not Berry.
      buildCommands:
        - yarn
        - yarn build
      # `.medusa/server/~` strips the prefix so the runtime root is the built server.
      deployFiles:
        - .medusa/server/~
        - tsconfig.json
        - package.json
        - node_modules
        - ./src/scripts/seed-files
      cache: node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 9000
          path: /health
    run:
      base: nodejs@22
      envVariables:
        DATABASE_TYPE: postgres
        NODE_ENV: production
        MEDUSA_FF_CACHING: "true"
        BACKEND_URL: ${API_URL}
        STOREFRONT_URL: ${APP_URL}
        STORE_CORS: ${APP_URL},${ANALOG_STORE_URL},http://localhost:8000,http://localhost:5173,http://localhost:3000
        ADMIN_CORS: ${API_URL},http://localhost:5173,http://localhost:9000
        AUTH_CORS: ${APP_URL},${API_URL},http://localhost:8000,http://localhost:5173,http://localhost:9000
        # Zerops Postgres uses the hostname as the database name.
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:5432/${db_hostname}?ssl_mode=disable
        MINIO_BUCKET: ${storage_bucketName}
        MINIO_ENDPOINT: ${storage_apiUrl}
        MINIO_SECRET_KEY: ${storage_secretAccessKey}
        MINIO_ACCESS_KEY: ${storage_accessKeyId}
        # connectionString includes the Valkey password (required on new services).
        REDIS_URL: ${redis_connectionString}
        CACHE_REDIS_URL: ${redis_connectionString}
        EVENTS_REDIS_URL: ${redis_connectionString}
        WE_REDIS_URL: ${redis_connectionString}
        LOCKING_REDIS_URL: ${redis_connectionString}
        MEILISEARCH_HOST: http://${search_hostname}:${search_port}
        MEILISEARCH_API_KEY: ${search_masterKey}
        MEILISEARCH_PRODUCT_INDEX_NAME: products
        JWT_SECRET: ${JWT_SECRET}
        COOKIE_SECRET: ${COOKIE_SECRET}
        SMTP_HOST: ${SMTP_HOST}
        SMTP_PORT: ${SMTP_PORT}
        SMTP_USER: ${SMTP_USER}
        SMTP_PASS: ${SMTP_PASS}
        SMTP_FROM: ${SMTP_FROM}
        SMTP_SECURE: ${SMTP_SECURE}
        STRIPE_API_KEY: ${STRIPE_API_KEY}
        STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
        GOOGLE_CALLBACK_URL: ${APP_URL}/auth/google/callback
        GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
        GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
        GITHUB_CALLBACK_URL: ${APP_URL}/auth/github/callback
        POSTHOG_EVENTS_API_KEY: ${POSTHOG_EVENTS_API_KEY}
        POSTHOG_HOST: ${POSTHOG_HOST}
      initCommands:
        # Schema and links can change on every Medusa deploy.
        - zsc execOnce ${appVersionId}_migration -- yarn migrate
        - zsc execOnce ${appVersionId}_links -- yarn syncLinks
        # Demo catalog and admin user are created once per service lifetime.
        - zsc execOnce createInitialSuperadmin -- yarn createInitialSuperadmin
        - zsc execOnce seedInitialData -- yarn seedInitialData
        - zsc execOnce setInitialPublishableKey -- yarn setInitialPublishableKey
        - zsc execOnce addInitialSearchDocuments -- yarn addInitialSearchDocuments
      ports:
        - port: 9000
          httpSupport: true
      start: yarn start
      healthCheck:
        httpGet:
          port: 9000
          path: /health
