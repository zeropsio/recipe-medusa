#yamlPreprocessor=on
# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json
#
# Standalone demo copy (same topology as `.zerops-recipe/3 — Stage`).
# Six-environment imports live under `.zerops-recipe/0 — AI Agent` … `5 — Highly-available Production`.
# Canonical catalog copies: https://github.com/zeropsio/recipes/tree/main/medusa
#
# Project value store: APP_URL / API_URL (and SEARCH_URL) are mapped to Medusa /
# Next.js keys in each app's zerops.yml. Do not put framework keys on services.

project:
  name: recipe-medusa
  envVariables:
    APP_URL: https://nextstore-${zeropsSubdomainHost}-8000.prg1.zerops.app
    API_URL: https://medusa-${zeropsSubdomainHost}-9000.prg1.zerops.app
    NEXT_STORE_URL: https://nextstore-${zeropsSubdomainHost}-8000.prg1.zerops.app
    MEDUSA_INSTANCE_URL: https://medusa-${zeropsSubdomainHost}-9000.prg1.zerops.app
    SEARCH_URL: https://search-${zeropsSubdomainHost}-7700.prg1.zerops.app
    ANALOG_STORE_URL: ""
    SMTP_HOST: ""
    SMTP_PORT: "587"
    SMTP_FROM: ""
    SMTP_SECURE: "false"
    POSTHOG_HOST: ""
    STRIPE_PUBLISHABLE_KEY: ""
  envSecrets:
    COOKIE_SECRET: <@generateRandomString(<32>)>
    JWT_SECRET: <@generateRandomString(<32>)>
    SMTP_USER: ""
    SMTP_PASS: ""
    STRIPE_API_KEY: ""
    STRIPE_WEBHOOK_SECRET: ""
    GOOGLE_CLIENT_ID: ""
    GOOGLE_CLIENT_SECRET: ""
    GITHUB_CLIENT_ID: ""
    GITHUB_CLIENT_SECRET: ""
    POSTHOG_EVENTS_API_KEY: ""
    RELOAD_SECRET: <@generateRandomString(<16>)>

services:
  - hostname: db
    type: postgresql:single@17
    profile: oltp-hobby
    priority: 10

  - hostname: redis
    type: valkey:single@7.2
    profile: hobby
    priority: 10

  - hostname: search
    type: meilisearch@1.10
    enableSubdomainAccess: true
    priority: 10

  - hostname: storage
    type: object-storage
    objectStorageSize: 2
    objectStoragePolicy: public-read
    priority: 10

  - hostname: medusa
    type: nodejs@22
    zeropsSetup: medusa
    buildFromGit: https://github.com/zeropsio/recipe-medusa
    enableSubdomainAccess: true
    envSecrets:
      SUPERADMIN_EMAIL: admin@example.com
      SUPERADMIN_PASSWORD: s4lt_<@generateRandomString(<16>)>
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
    priority: 6

  - hostname: nextstore
    type: nodejs@22
    zeropsSetup: nextstore
    buildFromGit: https://github.com/zeropsio/recipe-medusa-nextstore
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25
    priority: 5
