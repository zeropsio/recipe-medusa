#zeropsPreprocessor=on
# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json

# AI Agent environment — production Medusa + Next.js setups plus
# hobby data services. The app repos have no idle `setup: dev`;
# hostnames stay `medusa` / `nextstore` so the storefront can read
# ${medusa_CHANNEL_PUBLISHABLE_KEY} after seed.
#
# Project envVariables are a value store. Each app's zerops.yml maps:
#   APP_URL  → STOREFRONT_URL / NEXT_PUBLIC_BASE_URL / CORS
#   API_URL  → BACKEND_URL / ADMIN_CORS / MEDUSA_BACKEND_URL
#   SEARCH_URL → NEXT_PUBLIC_SEARCH_ENDPOINT
# Aliases NEXT_STORE_URL / MEDUSA_INSTANCE_URL match older recipe buttons.
project:
  name: medusa-agent
  envVariables:
    APP_URL: https://nextstore-${zeropsSubdomainHost}-8000.prg1.zerops.app
    API_URL: https://medusa-${zeropsSubdomainHost}-9000.prg1.zerops.app
    NEXT_STORE_URL: https://nextstore-${zeropsSubdomainHost}-8000.prg1.zerops.app
    MEDUSA_INSTANCE_URL: https://medusa-${zeropsSubdomainHost}-9000.prg1.zerops.app
    SEARCH_URL: https://search-${zeropsSubdomainHost}-7700.prg1.zerops.app
    ANALOG_STORE_URL: ""
    SMTP_HOST: ""
    SMTP_PORT: "587"
    SMTP_FROM: ""
    SMTP_SECURE: "false"
    POSTHOG_HOST: ""
    STRIPE_PUBLISHABLE_KEY: ""
  envSecrets:
    COOKIE_SECRET: <@generateRandomString(<32>)>
    JWT_SECRET: <@generateRandomString(<32>)>
    SMTP_USER: ""
    SMTP_PASS: ""
    STRIPE_API_KEY: ""
    STRIPE_WEBHOOK_SECRET: ""
    GOOGLE_CLIENT_ID: ""
    GOOGLE_CLIENT_SECRET: ""
    GITHUB_CLIENT_ID: ""
    GITHUB_CLIENT_SECRET: ""
    POSTHOG_EVENTS_API_KEY: ""
    RELOAD_SECRET: <@generateRandomString(<16>)>

services:
  # Data plane first so Medusa migrate / seed can connect on boot.
  - hostname: db
    type: postgresql:single@17
    profile: oltp-hobby
    priority: 10

  # Hobby Valkey — sessions, Caching Module, event bus, workflow
  # engine, and locking share this one instance. Profile only;
  # do not duplicate RAM in verticalAutoscaling.
  - hostname: redis
    type: valkey:single@7.2
    profile: hobby
    priority: 10

  # Single-node Meilisearch for the in-repo product index. Subdomain
  # access lets the storefront's NEXT_PUBLIC_SEARCH_ENDPOINT reach
  # :7700 from the browser.
  - hostname: search
    type: meilisearch@1.10
    enableSubdomainAccess: true
    priority: 10

  # Public-read MinIO — product images are requested from the
  # storefront and admin without signed URLs. 2 GB covers the seed
  # catalog; bump objectStorageSize when uploads grow.
  - hostname: storage
    type: object-storage
    objectStorageSize: 2
    objectStoragePolicy: public-read
    priority: 10

  # Medusa admin + Store / Admin API. 1 GB + 0.5 GB free is the
  # proven floor (admin UI + workflows). Superadmin is a service
  # secret so it is not in the project value store. zeropsSetup
  # must match `- setup: medusa` in recipe-medusa/zerops.yml.
  - hostname: medusa
    type: nodejs@22
    priority: 6
    zeropsSetup: medusa
    buildFromGit: https://github.com/zeropsio/recipe-medusa
    enableSubdomainAccess: true
    envSecrets:
      SUPERADMIN_EMAIL: admin@example.com
      SUPERADMIN_PASSWORD: s4lt_<@generateRandomString(<16>)>
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5

  # Official Next.js storefront. 0.5 GB + 0.25 GB free is the SSR
  # floor. RELOAD_SECRET is a project envSecret (medusa init POSTs reload-env). Hostname must
  # stay `nextstore` so APP_URL (port 8000) matches zerops.yml.
  - hostname: nextstore
    type: nodejs@22
    priority: 5
    zeropsSetup: nextstore
    buildFromGit: https://github.com/zeropsio/recipe-medusa-nextstore
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25
